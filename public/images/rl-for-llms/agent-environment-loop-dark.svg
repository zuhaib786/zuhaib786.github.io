<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-labelledby="title desc">
  <title id="title">The agent-environment loop</title>
  <desc id="desc">The agent sends an action to the environment. The environment changes and sends back the next observation and a reward. In Pong, the agent is a policy network and the environment is the Atari game.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a0aeff"/></marker></defs>
  <style>text{fill:#edf0ff;font-family:'Avenir Next',Avenir,Helvetica,Arial,sans-serif}.eyebrow{fill:#b0b8d0;font-size:11px;letter-spacing:1.6px}.main{font-size:19px}.name{font-size:17px;font-weight:600}.note{fill:#b0b8d0;font-size:13px}.label{font-size:14px}.box{fill:#242d49;stroke:#566383;stroke-width:1.3}.agent{fill:#34416d;stroke:#a0aeff;stroke-width:1.6}.flow{fill:none;stroke:#a0aeff;stroke-width:1.6}</style>
  <text x="28" y="30" class="eyebrow">THE INTERACTION LOOP</text>
  <text x="28" y="60" class="main">The agent acts; the environment answers</text>
  <rect x="60" y="112" width="180" height="88" rx="6" class="agent"/>
  <text x="150" y="152" text-anchor="middle" class="name">Agent</text>
  <text x="150" y="176" text-anchor="middle" class="note">policy network</text>
  <rect x="460" y="112" width="180" height="88" rx="6" class="box"/>
  <text x="550" y="152" text-anchor="middle" class="name">Environment</text>
  <text x="550" y="176" text-anchor="middle" class="note">Atari Pong</text>
  <path d="M240 136Q350 82 458 136" class="flow" marker-end="url(#arrow)"/>
  <text x="350" y="96" text-anchor="middle" class="label">action  a<tspan baseline-shift="sub" font-size="10">t</tspan>  (UP, DOWN or STAY)</text>
  <path d="M460 178Q350 232 242 178" class="flow" marker-end="url(#arrow)"/>
  <text x="350" y="236" text-anchor="middle" class="label">observation  o<tspan baseline-shift="sub" font-size="10">t+1</tspan>  and reward  r<tspan baseline-shift="sub" font-size="10">t+1</tspan></text>
  <text x="28" y="280" class="note">One step is one turn of the loop. One episode is one full game, first to 21.</text>
</svg>
