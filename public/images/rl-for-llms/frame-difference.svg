<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img" aria-labelledby="title desc">
  <title id="title">From a Pong frame to what the agent sees</title>
  <desc id="desc">A raw 210 by 160 colour Atari frame is cropped, downsampled and binarised into an 80 by 80 image of paddles and ball. Subtracting the previous preprocessed frame leaves only what moved: plus one where an object arrived, minus one where it left.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#643f61"/></marker></defs>
  <style>text{fill:#3d2b5a;font-family:'Avenir Next',Avenir,Helvetica,Arial,sans-serif}.eyebrow{fill:#643f61;font-size:11px;letter-spacing:1.6px}.main{font-size:19px}.name{font-size:14px;font-weight:600}.note{fill:#643f61;font-size:12px}.plus{fill:#2848a9;font-size:12px}.minus{fill:#ac5402;font-size:12px}.frame{fill:none;stroke:#aab0ad;stroke-width:1}.flow{fill:none;stroke:#643f61;stroke-width:1.3}</style>
  <text x="28" y="30" class="eyebrow">WHAT THE AGENT ACTUALLY SEES</text>
  <text x="28" y="60" class="main">Two frames in, one difference out</text>
  <image x="28" y="84" width="152" height="200" href="data:image/png;base64," style="image-rendering:pixelated"/>
  <rect x="28" y="84" width="152" height="200" class="frame"/>
  <path d="M188 184h32" class="flow" marker-end="url(#arrow)"/>
  <image x="228" y="84" width="200" height="200" href="data:image/png;base64," style="image-rendering:pixelated"/>
  <rect x="228" y="84" width="200" height="200" class="frame"/>
  <path d="M436 184h28" class="flow" marker-end="url(#arrow)"/>
  <image x="472" y="84" width="200" height="200" href="data:image/png;base64," style="image-rendering:pixelated"/>
  <rect x="472" y="84" width="200" height="200" class="frame"/>
  <text x="104" y="308" text-anchor="middle" class="name">frame t</text>
  <text x="104" y="326" text-anchor="middle" class="note">210 × 160 × 3, raw</text>
  <text x="328" y="308" text-anchor="middle" class="name">preprocess(frame t)</text>
  <text x="328" y="326" text-anchor="middle" class="note">80 × 80, 0 or 1</text>
  <text x="572" y="308" text-anchor="middle" class="name">minus preprocess(frame t−1)</text>
  <text x="572" y="326" text-anchor="middle" class="plus">+1 where something arrived</text>
  <text x="572" y="344" text-anchor="middle" class="minus">−1 where it left</text>
</svg>
