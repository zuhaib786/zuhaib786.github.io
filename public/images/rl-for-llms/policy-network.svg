<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-labelledby="title desc">
  <title id="title">The policy network</title>
  <desc id="desc">Input 2 by 80 by 80, the current frame and the difference. Conv 1: 16 filters of 8 by 8 with stride 4 and ReLU, giving 16 by 19 by 19, 2,064 parameters. Conv 2: 32 filters of 4 by 4 with stride 2 and ReLU, giving 32 by 8 by 8, 8,224 parameters. Flatten to 2,048. Hidden linear layer with ReLU to 256 units, 524,544 parameters. Output linear layer to 3 logits, 771 parameters. Softmax gives 3 probabilities. 535,603 parameters in total, 98 percent of them in the hidden layer.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#643f61"/></marker></defs>
  <style>text{fill:#3d2b5a;font-family:'Avenir Next',Avenir,Helvetica,Arial,sans-serif}.eyebrow{fill:#643f61;font-size:11px;letter-spacing:1.6px}.main{font-size:19px}.name{font-size:13px;font-weight:600}.note{fill:#643f61;font-size:11.5px}.shape{font-size:12.5px}.num{fill:#643f61;font-size:12px}.hotnum{fill:#2848a9;font-size:12px;font-weight:600}.plane{fill:#fbf8f6;stroke:#aab0ad;stroke-width:1.2}.hot{fill:#dddee6;stroke:#2848a9;stroke-width:1.6}.prob{fill:#643f61}.flow{fill:none;stroke:#643f61;stroke-width:1.3}.rowlabel{fill:#643f61;font-size:10px;letter-spacing:1.4px}</style>
  <text x="28" y="30" class="eyebrow">POLICY NETWORK</text>
  <text x="28" y="60" class="main">535,603 parameters, and 98% of them in one layer</text>
  <g><rect x="52" y="136" width="40" height="40" class="plane"/><rect x="56" y="130" width="40" height="40" class="plane"/><text x="74" y="222" text-anchor="middle" class="name">Input</text><text x="74" y="240" text-anchor="middle" class="note">frame + diff</text><text x="74" y="262" text-anchor="middle" class="shape">2×80×80</text><text x="74" y="280" text-anchor="middle" class="num">–</text></g><path d="M107 152H132" class="flow" marker-end="url(#arrow)"/><g><rect x="147" y="143" width="28" height="28" class="plane"/><rect x="152" y="138" width="28" height="28" class="plane"/><rect x="157" y="133" width="28" height="28" class="plane"/><text x="166" y="222" text-anchor="middle" class="name">Conv 1</text><text x="166" y="240" text-anchor="middle" class="note">16 · 8×8 · s4</text><text x="166" y="262" text-anchor="middle" class="shape">16×19×19</text><text x="166" y="280" text-anchor="middle" class="num">2,064</text></g><path d="M198 152H232" class="flow" marker-end="url(#arrow)"/><g><rect x="246" y="150" width="14" height="14" class="plane"/><rect x="250" y="146" width="14" height="14" class="plane"/><rect x="254" y="142" width="14" height="14" class="plane"/><rect x="258" y="138" width="14" height="14" class="plane"/><text x="258" y="222" text-anchor="middle" class="name">Conv 2</text><text x="258" y="240" text-anchor="middle" class="note">32 · 4×4 · s2</text><text x="258" y="262" text-anchor="middle" class="shape">32×8×8</text><text x="258" y="280" text-anchor="middle" class="num">8,224</text></g><path d="M282 152H335" class="flow" marker-end="url(#arrow)"/><g><rect x="345" y="110" width="10" height="84" rx="2" class="plane"/><text x="350" y="222" text-anchor="middle" class="name">Flatten</text><text x="350" y="240" text-anchor="middle" class="note"></text><text x="350" y="262" text-anchor="middle" class="shape">2,048</text><text x="350" y="280" text-anchor="middle" class="num">–</text></g><path d="M363 152H427" class="flow" marker-end="url(#arrow)"/><g><rect x="437" y="132" width="10" height="40" rx="2" class="hot"/><text x="442" y="222" text-anchor="middle" class="name">Hidden</text><text x="442" y="240" text-anchor="middle" class="note">linear + ReLU</text><text x="442" y="262" text-anchor="middle" class="shape">256</text><text x="442" y="280" text-anchor="middle" class="hotnum">524,544</text></g><path d="M455 152H518" class="flow" marker-end="url(#arrow)"/><g><circle cx="534" cy="136" r="6" class="plane"/><circle cx="534" cy="152" r="6" class="plane"/><circle cx="534" cy="168" r="6" class="plane"/><text x="534" y="222" text-anchor="middle" class="name">Output</text><text x="534" y="240" text-anchor="middle" class="note">linear</text><text x="534" y="262" text-anchor="middle" class="shape">3 logits</text><text x="534" y="280" text-anchor="middle" class="num">771</text></g><path d="M548 152H605" class="flow" marker-end="url(#arrow)"/><g><rect x="614" y="142" width="6" height="20" class="prob"/><rect x="623" y="151" width="6" height="11" class="prob"/><rect x="632" y="147" width="6" height="15" class="prob"/><text x="626" y="222" text-anchor="middle" class="name">Softmax</text><text x="626" y="240" text-anchor="middle" class="note">roll the die</text><text x="626" y="262" text-anchor="middle" class="shape">3 probs</text><text x="626" y="280" text-anchor="middle" class="num">–</text></g>
  <text x="28" y="306" class="note">Each column: layer · filters, kernel, stride · output shape · parameters</text>
</svg>
