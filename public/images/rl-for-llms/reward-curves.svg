<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Average reward per 500 games for three training runs</title>
  <desc id="desc">The tiny network stays near minus 20 for all 3,232 of its games. The 535k network at learning rate 1e-4 climbs slowly to about minus 11 after 17,849 games. The same network at learning rate 1e-3 crosses zero, even with the opponent, around game 3,500 and levels off near plus 12 by game 10,481.</desc>
