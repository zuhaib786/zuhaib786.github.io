<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img" aria-labelledby="title desc">
  <title id="title">A paddle that stays still vanishes from the difference frame</title>
  <desc id="desc">Two real consecutive Pong frames in which our paddle did not move. In the preprocessed current frame the paddle is clearly visible on the right. In the difference between the two frames the moving ball and the opponent paddle remain; where our paddle should be there is nothing.</desc>
  <style>text{fill:#edf0ff;font-family:'Avenir Next',Avenir,Helvetica,Arial,sans-serif}.eyebrow{fill:#b0b8d0;font-size:11px;letter-spacing:1.6px}.main{font-size:19px}.name{font-size:14px;font-weight:600}.note{fill:#b0b8d0;font-size:12px}.tag{fill:#e0bd78;font-size:12px}.frame{fill:none;stroke:#566383;stroke-width:1}.found{fill:none;stroke:#a0aeff;stroke-width:1.5}.lost{fill:none;stroke:#e0bd78;stroke-width:1.5;stroke-dasharray:4 3}</style>
  <text x="28" y="30" class="eyebrow">EUREKA NUMBER TWO</text>
  <text x="28" y="60" class="main">Stand still and you disappear</text>
  <image x="118" y="84" width="200" height="200" href="data:image/png;base64," style="image-rendering:pixelated"/>
  <rect x="118" y="84" width="200" height="200" class="frame"/>
  <rect x="286.0" y="154.5" width="19.0" height="34.0" rx="3" class="found"/>
  <image x="382" y="84" width="200" height="200" href="data:image/png;base64," style="image-rendering:pixelated"/>
  <rect x="382" y="84" width="200" height="200" class="frame"/>
  <rect x="550.0" y="154.5" width="19.0" height="34.0" rx="3" class="lost"/>
  <text x="544.0" y="175.5" text-anchor="end" class="tag">our paddle?</text>
  <text x="218" y="308" text-anchor="middle" class="name">preprocess(frame t)</text>
  <text x="218" y="326" text-anchor="middle" class="note">the paddle is right there</text>
  <text x="482" y="308" text-anchor="middle" class="name">difference</text>
  <text x="482" y="326" text-anchor="middle" class="note">the ball and their paddle moved; ours didn’t</text>
</svg>
