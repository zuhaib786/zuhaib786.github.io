<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img">
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .t   { fill: #131824; font-size: 13px; font-weight: 600; }
  .l   { fill: #131824; font-size: 12px; font-weight: 600; }
  .s   { fill: #4d5670; font-size: 11px; }
  .f   { fill: #808aa4; font-size: 10px; letter-spacing: .06em; }
  .a   { fill: #c8401a; font-size: 11px; font-weight: 600; }
  .a2  { fill: #4b3fd6; font-size: 11px; font-weight: 600; }
  .axis{ stroke: #131824; fill: none; stroke-width: 1.2; }
  .ln  { stroke: #a9b3c9; fill: none; }
  .ray { stroke: #4d5670; fill: none; stroke-width: 1.2; }
  .acc { stroke: #c8401a; fill: none; stroke-width: 1.5; }
  .plane { fill: #ffffff; fill-opacity: .28; stroke: #a9b3c9; }
  .dot { fill: #131824; }
  .dotA{ fill: #c8401a; }
  .hd  { fill: #131824; }
  .hdS { fill: #4d5670; }
  .hdA { fill: #c8401a; }
</style>
<defs>
  <marker id="h" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
    <path d="M0 0.5 L6 3 L0 5.5 z" class="hd"/></marker>
  <marker id="hs" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
    <path d="M0 0.5 L6 3 L0 5.5 z" class="hdS"/></marker>
  <marker id="hA" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
    <path d="M0 0.5 L6 3 L0 5.5 z" class="hdA"/></marker>
</defs>
<text x="14" y="16" class="t" text-anchor="start">(a) the pinhole model</text>
