<text x="178" y="136" class="l" text-anchor="start">X</text>
<path d="M195 285 L195 115 L265 70 L265 240 Z" class="plane"/>
<text x="272" y="254" class="s" text-anchor="start">Z = f</text>
<path d="M90 200 L430 120" class="ray"/>
