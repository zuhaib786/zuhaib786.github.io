<circle cx="640" cy="230" r="4" class="dot"/>
<text x="634" y="246" class="l" text-anchor="end">p</text>
<path d="M560 218 H572 V230" class="ln"/>
<path d="M640 218 H628 V230" class="ln"/>
<path d="M560 250 V264" class="ln"/>
<path d="M640 250 V264" class="ln"/>
<path d="M600 257 H564" class="ray" marker-end="url(#hs)"/>
<path d="M600 257 H636" class="ray" marker-end="url(#hs)"/>
<text x="600" y="276" class="l" text-anchor="middle">f</text>
<path d="M830 234 V288" class="ln"/>
<path d="M695 282 H564" class="ray" marker-end="url(#hs)"/>
<path d="M695 282 H826" class="ray" marker-end="url(#hs)"/>
<text x="695" y="300" class="l" text-anchor="middle">Z</text>
<text x="520" y="322" class="a2" text-anchor="start">two similar triangles ⇒  y = f · Y / Z   and   x = f · X / Z</text>
<path d="M500 6 V330" class="ln" stroke-dasharray="2 4"/>
</svg>
