<text x="672" y="52" class="f">P(CLASS)</text>
<rect x="672" y="72" width="46" height="17" rx="2" class="wash"/>
<text x="726" y="84" class="s">none</text>
<rect x="672" y="106" width="74" height="17" rx="2" class="wash"/>
<text x="754" y="118" class="s">hilarious</text>
<rect x="672" y="140" width="150" height="17" rx="2" class="fillA"/>
<text x="830" y="152" class="a">troll</text>
<text x="672" y="196" class="s">argmax over 3 classes</text>
<text x="672" y="212" class="s">5-fold out-of-fold scoring</text>
</svg>
