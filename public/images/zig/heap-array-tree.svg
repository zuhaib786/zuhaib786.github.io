<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img">
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .t   { fill: #131824; font-size: 13px; font-weight: 600; }
  .l   { fill: #131824; font-size: 11.5px; }
  .s   { fill: #4d5670; font-size: 11px; }
  .f   { fill: #808aa4; font-size: 10px; letter-spacing: .08em; }
  .a   { fill: #c8401a; font-size: 11px; font-weight: 600; }
  .a2  { fill: #4b3fd6; font-size: 11px; font-weight: 600; }
  .box { fill: #ffffff; fill-opacity: 0.72; stroke: #a9b3c9; }
  .cell{ fill: #ffffff; fill-opacity: 0.72; stroke: #a9b3c9; }
  .hot { fill: #ffffff; fill-opacity: 0.72; stroke: #c8401a; stroke-width: 1.5; }
  .void{ fill: #dde3ef; fill-opacity: .5; stroke: #a9b3c9; stroke-dasharray: 3 3; }
  .ln  { stroke: #a9b3c9; fill: none; }
  .ar  { stroke: #4d5670; fill: none; stroke-width: 1.4; }
  .arA { stroke: #c8401a; fill: none; stroke-width: 1.6; }
  .hdA { fill: #c8401a; }
  .hd  { fill: #4d5670; }
  .strike { stroke: #c8401a; stroke-width: 1.6; }
</style>
<defs>
  <marker id="h" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
    <path d="M0 0.5 L6 3 L0 5.5 z" class="hd"/>
  </marker>
  <marker id="hA" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
    <path d="M0 0.5 L6 3 L0 5.5 z" class="hdA"/>
  </marker>
</defs>
<text x="14" y="16" class="t" text-anchor="start">one array, two readings</text>
<text x="322.0" y="38" class="f" text-anchor="middle">[0]</text>
<text x="366.0" y="38" class="f" text-anchor="middle">[1]</text>
<text x="410.0" y="38" class="f" text-anchor="middle">[2]</text>
<text x="454.0" y="38" class="f" text-anchor="middle">[3]</text>
<text x="498.0" y="38" class="f" text-anchor="middle">[4]</text>
<text x="542.0" y="38" class="f" text-anchor="middle">[5]</text>
<text x="586.0" y="38" class="f" text-anchor="middle">[6]</text>
<rect x="300" y="44" width="44" height="32" class="cell"/>
<text x="322.0" y="64.0" class="l" text-anchor="middle">1</text>
<rect x="344" y="44" width="44" height="32" class="hot"/>
<text x="366.0" y="64.0" class="l" text-anchor="middle">3</text>
<rect x="388" y="44" width="44" height="32" class="cell"/>
<text x="410.0" y="64.0" class="l" text-anchor="middle">2</text>
<rect x="432" y="44" width="44" height="32" class="hot"/>
<text x="454.0" y="64.0" class="l" text-anchor="middle">7</text>
<rect x="476" y="44" width="44" height="32" class="hot"/>
<text x="498.0" y="64.0" class="l" text-anchor="middle">5</text>
<rect x="520" y="44" width="44" height="32" class="cell"/>
<text x="542.0" y="64.0" class="l" text-anchor="middle">4</text>
<rect x="564" y="44" width="44" height="32" class="cell"/>
<text x="586.0" y="64.0" class="l" text-anchor="middle">9</text>
<text x="290" y="66" class="s" text-anchor="end">list.items</text>
<path d="M454 138 L354 160" class="ln" fill="none"/>
<path d="M454 138 L554 160" class="ln" fill="none"/>
<path d="M354 192 L294 214" class="arA" fill="none"/>
<path d="M354 192 L414 214" class="arA" fill="none"/>
<path d="M554 192 L514 214" class="ln" fill="none"/>
<path d="M554 192 L634 214" class="ln" fill="none"/>
<circle cx="454" cy="122" r="16" class="box"/>
<text x="454" y="126" class="l" text-anchor="middle">1</text>
<text x="474" y="112" class="f" text-anchor="start">[0]</text>
<circle cx="354" cy="176" r="16" class="hot"/>
<text x="354" y="180" class="l" text-anchor="middle">3</text>
<text x="374" y="166" class="f" text-anchor="start">[1]</text>
<circle cx="554" cy="176" r="16" class="box"/>
<text x="554" y="180" class="l" text-anchor="middle">2</text>
<text x="574" y="166" class="f" text-anchor="start">[2]</text>
<circle cx="294" cy="230" r="16" class="hot"/>
<text x="294" y="234" class="l" text-anchor="middle">7</text>
<text x="314" y="220" class="f" text-anchor="start">[3]</text>
<circle cx="414" cy="230" r="16" class="hot"/>
<text x="414" y="234" class="l" text-anchor="middle">5</text>
<text x="434" y="220" class="f" text-anchor="start">[4]</text>
<circle cx="514" cy="230" r="16" class="box"/>
<text x="514" y="234" class="l" text-anchor="middle">4</text>
<text x="534" y="220" class="f" text-anchor="start">[5]</text>
<circle cx="634" cy="230" r="16" class="box"/>
<text x="634" y="234" class="l" text-anchor="middle">9</text>
<text x="654" y="220" class="f" text-anchor="start">[6]</text>
<path d="M366.0 78 L354 156" class="arA" stroke-dasharray="3 3" fill="none"/>
<text x="20" y="120" class="s" text-anchor="start">parent(i) = (i-1)/2</text>
<text x="20" y="140" class="s" text-anchor="start">left(i)   = 2i+1</text>
<text x="20" y="160" class="s" text-anchor="start">right(i)  = 2i+2</text>
<text x="20" y="192" class="a" text-anchor="start">i = 1 → children [3], [4]</text>
<text x="20" y="224" class="a2" text-anchor="start">the tree shape is implied</text>
<text x="20" y="240" class="a2" text-anchor="start">by position — no nodes,</text>
<text x="20" y="256" class="a2" text-anchor="start">no pointers, just indices</text>
<text x="700" y="120" class="s" text-anchor="start">every parent ≤ its children.</text>
<text x="700" y="140" class="s" text-anchor="start">insert appends and bubbles</text>
<text x="700" y="160" class="s" text-anchor="start">up; pop swaps the root with</text>
<text x="700" y="180" class="s" text-anchor="start">the last cell and sifts down.</text>
<text x="700" y="212" class="f" text-anchor="start">growth, capacity and free</text>
<text x="700" y="228" class="f" text-anchor="start">come free from ArrayList</text>
</svg>
