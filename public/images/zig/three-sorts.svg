}
@keyframes qck3 {
  0.0% { transform: translate(734px, 40px); }
  8.0% { transform: translate(734px, 40px); }
  23.6% { transform: translate(734px, 40px); }
  32.0% { transform: translate(734px, 40px); }
  39.8% { transform: translate(704.0px, 27px); }
  47.6% { transform: translate(674px, 40px); }
  56.0% { transform: translate(674px, 40px); }
  71.6% { transform: translate(674px, 40px); }
  80.0% { transform: translate(674px, 40px); }
  100.0% { transform: translate(674px, 40px); }
}
</style>
<defs>
  <marker id="hA" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
    <path d="M0 0.5 L6 3 L0 5.5 z" class="hdA"/></marker>
</defs>
<text x="14" y="16" class="t" text-anchor="start">(a) insertion</text>
<g class="e" style="animation-name:ins2" transform="translate(44,40)"><rect width="30" height="28" rx="2" class="cell"/><text x="15.0" y="18.0" class="l" text-anchor="middle">2</text></g>
<g class="e" style="animation-name:ins4" transform="translate(104,40)"><rect width="30" height="28" rx="2" class="cell"/><text x="15.0" y="18.0" class="l" text-anchor="middle">4</text></g>
<g class="e" style="animation-name:ins1" transform="translate(14,40)"><rect width="30" height="28" rx="2" class="cell"/><text x="15.0" y="18.0" class="l" text-anchor="middle">1</text></g>
<g class="e" style="animation-name:ins3" transform="translate(74,40)"><rect width="30" height="28" rx="2" class="cell"/><text x="15.0" y="18.0" class="l" text-anchor="middle">3</text></g>
<g class="e" style="animation-name:ins5" transform="translate(134,40)"><rect width="30" height="28" rx="2" class="cell"/><text x="15.0" y="18.0" class="l" text-anchor="middle">5</text></g>
<text x="14" y="100" class="s" text-anchor="start">each value shifts right to</text>
<text x="14" y="116" class="s" text-anchor="start">open a gap — nothing is copied</text>
<text x="14" y="132" class="s" text-anchor="start">anywhere else</text>
<text x="14" y="196" class="f" text-anchor="start">ALLOCATOR: NONE</text>
<text x="14" y="218" class="a2" text-anchor="start">shifts in place</text>
<text x="314" y="16" class="t" text-anchor="start">(b) merge</text>
<rect x="314" y="104" width="30" height="28" rx="2" class="void"/>
<rect x="344" y="104" width="30" height="28" rx="2" class="void"/>
<rect x="374" y="104" width="30" height="28" rx="2" class="void"/>
<rect x="404" y="104" width="30" height="28" rx="2" class="void"/>
<rect x="434" y="104" width="30" height="28" rx="2" class="void"/>
<path d="M464 74 V96" class="arA" marker-end="url(#hA)"/>
<text x="476" y="90" class="a" text-anchor="start">alloc scratch</text>
<g class="e" style="animation-name:mrg1" transform="translate(314,40)"><rect width="30" height="28" rx="2" class="cell"/><text x="15.0" y="18.0" class="l" text-anchor="middle">1</text></g>
<g class="e" style="animation-name:mrg3" transform="translate(374,40)"><rect width="30" height="28" rx="2" class="cell"/><text x="15.0" y="18.0" class="l" text-anchor="middle">3</text></g>
<g class="e" style="animation-name:mrg2" transform="translate(344,40)"><rect width="30" height="28" rx="2" class="cell"/><text x="15.0" y="18.0" class="l" text-anchor="middle">2</text></g>
<g class="e" style="animation-name:mrg4" transform="translate(404,40)"><rect width="30" height="28" rx="2" class="cell"/><text x="15.0" y="18.0" class="l" text-anchor="middle">4</text></g>
<g class="e" style="animation-name:mrg5" transform="translate(434,40)"><rect width="30" height="28" rx="2" class="cell"/><text x="15.0" y="18.0" class="l" text-anchor="middle">5</text></g>
<text x="314" y="150" class="f" text-anchor="start">SCRATCH — O(n) EXTRA, FREED AFTER</text>
<text x="314" y="172" class="s" text-anchor="start">the merge has nowhere to land</text>
<text x="314" y="188" class="s" text-anchor="start">but a second buffer</text>
<text x="314" y="208" class="f" text-anchor="start">ALLOCATOR: ALLOC n</text>
<text x="314" y="226" class="a" text-anchor="start">needs a scratch buffer</text>
<text x="614" y="16" class="t" text-anchor="start">(c) quick</text>
<g class="e" style="animation-name:qck2" transform="translate(644,40)"><rect width="30" height="28" rx="2" class="cell"/><text x="15.0" y="18.0" class="l" text-anchor="middle">2</text></g>
<g class="e" style="animation-name:qck5" transform="translate(734,40)"><rect width="30" height="28" rx="2" class="cell"/><text x="15.0" y="18.0" class="l" text-anchor="middle">5</text></g>
<g class="e" style="animation-name:qck1" transform="translate(614,40)"><rect width="30" height="28" rx="2" class="cell"/><text x="15.0" y="18.0" class="l" text-anchor="middle">1</text></g>
<g class="e" style="animation-name:qck4" transform="translate(704,40)"><rect width="30" height="28" rx="2" class="cell"/><text x="15.0" y="18.0" class="l" text-anchor="middle">4</text></g>
<g class="e" style="animation-name:qck3" transform="translate(674,40)"><rect width="30" height="28" rx="2" class="hot"/><text x="15.0" y="18.0" class="l" text-anchor="middle">3</text></g>
<text x="614" y="100" class="a" text-anchor="start">pivot 3 swaps into place,</text>
<text x="614" y="116" class="s" text-anchor="start">then each side sorts itself</text>
<text x="614" y="132" class="s" text-anchor="start">— only the recursion costs</text>
<text x="614" y="148" class="s" text-anchor="start">anything, at O(log n)</text>
<text x="614" y="196" class="f" text-anchor="start">ALLOCATOR: NONE</text>
<text x="614" y="218" class="a2" text-anchor="start">partitions in place</text>
<path d="M290 6 V232" class="ln" stroke-dasharray="2 4"/>
<path d="M590 6 V232" class="ln" stroke-dasharray="2 4"/>
</svg>
