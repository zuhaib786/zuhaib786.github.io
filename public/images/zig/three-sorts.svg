  0.0% { transform: translate(704px, 40px); }
  8.0% { transform: translate(704px, 40px); }
  23.6% { transform: translate(704px, 40px); }
  32.0% { transform: translate(704px, 40px); }
  47.6% { transform: translate(704px, 40px); }
  56.0% { transform: translate(704px, 40px); }
  71.6% { transform: translate(704px, 40px); }
