  0.0% { transform: translate(104px, 40px); }
  8.0% { transform: translate(104px, 40px); }
  31.4% { transform: translate(104px, 40px); }
  44.0% { transform: translate(104px, 40px); }
  55.7% { transform: translate(89.0px, 27px); }
  67.4% { transform: translate(74px, 40px); }
  80.0% { transform: translate(74px, 40px); }
  100.0% { transform: translate(74px, 40px); }
}
@keyframes ins5 {
  0.0% { transform: translate(134px, 40px); }
  8.0% { transform: translate(134px, 40px); }
  31.4% { transform: translate(134px, 40px); }
