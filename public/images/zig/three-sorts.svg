  0.0% { transform: translate(674px, 40px); }
  8.0% { transform: translate(674px, 40px); }
  15.8% { transform: translate(659.0px, 27px); }
  23.6% { transform: translate(644px, 40px); }
  32.0% { transform: translate(644px, 40px); }
  47.6% { transform: translate(644px, 40px); }
  56.0% { transform: translate(644px, 40px); }
  63.8% { transform: translate(629.0px, 27px); }
  71.6% { transform: translate(614px, 40px); }
  80.0% { transform: translate(614px, 40px); }
  100.0% { transform: translate(614px, 40px); }
}
