}
@keyframes mrg1 {
  0.0% { transform: translate(314px, 40px); }
  8.0% { transform: translate(314px, 40px); }
  31.4% { transform: translate(314px, 104px); }
  44.0% { transform: translate(314px, 104px); }
  67.4% { transform: translate(314px, 40px); }
  80.0% { transform: translate(314px, 40px); }
  100.0% { transform: translate(314px, 40px); }
}
@keyframes mrg3 {
  0.0% { transform: translate(344px, 40px); }
  8.0% { transform: translate(344px, 40px); }
  31.4% { transform: translate(374px, 104px); }
  44.0% { transform: translate(374px, 104px); }
  67.4% { transform: translate(374px, 40px); }
  80.0% { transform: translate(374px, 40px); }
  100.0% { transform: translate(374px, 40px); }
}
@keyframes mrg2 {
  0.0% { transform: translate(374px, 40px); }
  8.0% { transform: translate(374px, 40px); }
  31.4% { transform: translate(344px, 104px); }
  44.0% { transform: translate(344px, 104px); }
  67.4% { transform: translate(344px, 40px); }
  80.0% { transform: translate(344px, 40px); }
  100.0% { transform: translate(344px, 40px); }
}
@keyframes mrg4 {
  0.0% { transform: translate(404px, 40px); }
  8.0% { transform: translate(404px, 40px); }
  31.4% { transform: translate(404px, 104px); }
  44.0% { transform: translate(404px, 104px); }
  67.4% { transform: translate(404px, 40px); }
  80.0% { transform: translate(404px, 40px); }
  100.0% { transform: translate(404px, 40px); }
}
@keyframes mrg5 {
  0.0% { transform: translate(434px, 40px); }
  8.0% { transform: translate(434px, 40px); }
  31.4% { transform: translate(434px, 104px); }
  44.0% { transform: translate(434px, 104px); }
  67.4% { transform: translate(434px, 40px); }
  80.0% { transform: translate(434px, 40px); }
  100.0% { transform: translate(434px, 40px); }
}
@keyframes qck2 {
  0.0% { transform: translate(614px, 40px); }
  8.0% { transform: translate(614px, 40px); }
  23.6% { transform: translate(614px, 40px); }
  32.0% { transform: translate(614px, 40px); }
  47.6% { transform: translate(614px, 40px); }
  56.0% { transform: translate(614px, 40px); }
  63.8% { transform: translate(629.0px, 53px); }
  71.6% { transform: translate(644px, 40px); }
  80.0% { transform: translate(644px, 40px); }
  100.0% { transform: translate(644px, 40px); }
}
@keyframes qck5 {
  0.0% { transform: translate(644px, 40px); }
  8.0% { transform: translate(644px, 40px); }
  15.8% { transform: translate(659.0px, 53px); }
  23.6% { transform: translate(674px, 40px); }
  32.0% { transform: translate(674px, 40px); }
  39.8% { transform: translate(704.0px, 53px); }
  47.6% { transform: translate(734px, 40px); }
  56.0% { transform: translate(734px, 40px); }
  71.6% { transform: translate(734px, 40px); }
  80.0% { transform: translate(734px, 40px); }
  100.0% { transform: translate(734px, 40px); }
}
