<text x="389.0" y="58.0" class="l" text-anchor="middle">c</text>
<rect x="404" y="40" width="30" height="28" class="cell"/>
<text x="419.0" y="58.0" class="l" text-anchor="middle">d</text>
<text x="440" y="58" class="s" text-anchor="start">len = cap = 4 → full</text>
<path d="M370 72 V96" class="arA" marker-end="url(#hA)"/>
<text x="382" y="88" class="a" text-anchor="start">realloc @max(8, len*2)</text>
<rect x="314" y="100" width="30" height="28" class="cell"/>
<text x="329.0" y="118.0" class="l" text-anchor="middle">a</text>
<rect x="344" y="100" width="30" height="28" class="cell"/>
<text x="359.0" y="118.0" class="l" text-anchor="middle">b</text>
