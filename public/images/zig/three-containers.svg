<rect x="524" y="100" width="30" height="28" class="void"/>
<text x="314" y="146" class="f" text-anchor="start">CAP = 8 · LEN = 4</text>
<text x="314" y="172" class="s" text-anchor="start">pop() never shrinks —</text>
<text x="314" y="190" class="s" text-anchor="start">capacity is kept for reuse</text>
<text x="314" y="212" class="a2" text-anchor="start">N pushes cost O(N) total ✓</text>
<text x="614" y="16" class="t" text-anchor="start">(c) LRU — two layers</text>
<rect x="614" y="34" width="120" height="24" rx="3" class="box"/>
<text x="674" y="50" class="s" text-anchor="middle">StringHashMap</text>
<rect x="614" y="88" width="56" height="24" rx="3" class="box"/>
<text x="642" y="104" class="s" text-anchor="middle">MRU</text>
<path d="M670 100 H678" class="ar" marker-end="url(#h)"/>
<rect x="680" y="88" width="56" height="24" rx="3" class="box"/>
<text x="708" y="104" class="s" text-anchor="middle">·</text>
<path d="M736 100 H744" class="ar" marker-end="url(#h)"/>
<rect x="746" y="88" width="56" height="24" rx="3" class="box"/>
<text x="774" y="104" class="s" text-anchor="middle">LRU</text>
<text x="774" y="128" class="f" text-anchor="middle">evict ▸</text>
<path d="M650 60 V84" class="ar" marker-end="url(#h)"/>
<rect x="614" y="140" width="52" height="24" rx="3" class="hot"/>
<text x="640" y="156" class="l" text-anchor="middle">"a"</text>
