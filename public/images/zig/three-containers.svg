<path d="M642 114 V136" class="arA" marker-end="url(#hA)"/>
<text x="676" y="156" class="a" text-anchor="start">one duped key,</text>
<text x="676" y="172" class="a" text-anchor="start">two referents</text>
<text x="614" y="200" class="s" text-anchor="start">deinit: map first (buckets only),</text>
<text x="614" y="216" class="s" text-anchor="start">then walk the list and free keys</text>
<path d="M290 6 V224" class="ln" stroke-dasharray="2 4"/>
<path d="M590 6 V224" class="ln" stroke-dasharray="2 4"/>
