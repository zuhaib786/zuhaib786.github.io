<text x="134" y="126" class="s" text-anchor="middle">wrap</text>
<text x="14" y="154" class="a" text-anchor="start">tail = (head + count) % len</text>
<text x="14" y="172" class="s" text-anchor="start">computed, never stored</text>
<text x="14" y="194" class="f" text-anchor="start">one alloc in init, one free in deinit</text>
<text x="314" y="16" class="t" text-anchor="start">(b) stack — doubling</text>
<rect x="314" y="40" width="30" height="28" class="cell"/>
<text x="329.0" y="58.0" class="l" text-anchor="middle">a</text>
<rect x="344" y="40" width="30" height="28" class="cell"/>
<text x="359.0" y="58.0" class="l" text-anchor="middle">b</text>
