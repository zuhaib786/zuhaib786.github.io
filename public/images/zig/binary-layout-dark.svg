<text x="40" y="152" class="a" text-anchor="start">MAGIC</text>
<text x="122" y="152" class="s" text-anchor="start">"LZIG" at offset 0 — reject a JPEG at byte four, before allocating a 4 GB "key" from random bytes.</text>
<text x="40" y="178" class="a" text-anchor="start">VERSION</text>
<text x="122" y="178" class="s" text-anchor="start">u16 — a future layout bumps to 2, and an old reader refuses it cleanly instead of misreading it.</text>
<text x="40" y="204" class="a" text-anchor="start">KEY_LEN</text>
<text x="122" y="204" class="s" text-anchor="start">u32 then exactly that many bytes — any byte is legal data, so a binary format cannot delimit.</text>
<text x="40" y="230" class="a" text-anchor="start">VALUE</text>
<text x="122" y="230" class="s" text-anchor="start">14 00 00 00 is 20 little-endian, low byte first. Writer and reader must agree or every number scrambles.</text>
