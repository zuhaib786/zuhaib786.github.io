<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 266" width="900" height="266" role="img">
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .t   { fill: #131824; font-size: 13px; font-weight: 600; }
  .l   { fill: #131824; font-size: 11.5px; }
  .s   { fill: #4d5670; font-size: 11px; }
  .f   { fill: #808aa4; font-size: 10px; letter-spacing: .08em; }
  .a   { fill: #c8401a; font-size: 11px; font-weight: 600; }
  .a2  { fill: #4b3fd6; font-size: 11px; font-weight: 600; }
  .box { fill: #ffffff; fill-opacity: 0.72; stroke: #a9b3c9; }
  .cell{ fill: #ffffff; fill-opacity: 0.72; stroke: #a9b3c9; }
  .hot { fill: #ffffff; fill-opacity: 0.72; stroke: #c8401a; stroke-width: 1.5; }
  .void{ fill: #dde3ef; fill-opacity: .5; stroke: #a9b3c9; stroke-dasharray: 3 3; }
  .ln  { stroke: #a9b3c9; fill: none; }
  .ar  { stroke: #4d5670; fill: none; stroke-width: 1.4; }
  .arA { stroke: #c8401a; fill: none; stroke-width: 1.6; }
  .hdA { fill: #c8401a; }
  .hd  { fill: #4d5670; }
  .strike { stroke: #c8401a; stroke-width: 1.6; }
</style>
<defs>
  <marker id="h" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
    <path d="M0 0.5 L6 3 L0 5.5 z" class="hd"/>
  </marker>
  <marker id="hA" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
    <path d="M0 0.5 L6 3 L0 5.5 z" class="hdA"/>
  </marker>
</defs>
<text x="14" y="16" class="t" text-anchor="start">(a) close() { not_empty.signal(io) }</text>
<rect x="14" y="34" width="200" height="28" rx="3" class="hot"/>
<text x="114" y="52" class="a" text-anchor="middle">queue · closed · empty</text>
<path d="M60 64 L43 104" class="arA" marker-end="url(#hA)"/>
<rect x="20" y="108" width="46" height="28" rx="3" class="hot"/>
<text x="43" y="126" class="l" text-anchor="middle">W1</text>
<text x="43" y="154" class="a" text-anchor="middle">wakes</text>
<text x="43" y="170" class="a" text-anchor="middle">exits ✓</text>
<rect x="90" y="108" width="46" height="28" rx="3" class="void"/>
<text x="113" y="126" class="s" text-anchor="middle">W2</text>
<text x="113" y="154" class="f" text-anchor="middle">zZ</text>
<text x="113" y="170" class="f" text-anchor="middle">blocked</text>
<rect x="160" y="108" width="46" height="28" rx="3" class="void"/>
<text x="183" y="126" class="s" text-anchor="middle">W3</text>
<text x="183" y="154" class="f" text-anchor="middle">zZ</text>
<text x="183" y="170" class="f" text-anchor="middle">blocked</text>
<rect x="230" y="108" width="46" height="28" rx="3" class="void"/>
<text x="253" y="126" class="s" text-anchor="middle">W4</text>
<text x="253" y="154" class="f" text-anchor="middle">zZ</text>
<text x="253" y="170" class="f" text-anchor="middle">blocked</text>
<text x="14" y="202" class="f" text-anchor="start">SIGNAL WAKES ONE</text>
<text x="14" y="224" class="a" text-anchor="start">3 workers sleep forever · shutdown hangs ✗</text>
<text x="484" y="16" class="t" text-anchor="start">(b) close() { not_empty.broadcast(io) }</text>
<rect x="484" y="34" width="200" height="28" rx="3" class="hot"/>
<text x="584" y="52" class="a" text-anchor="middle">queue · closed · empty</text>
<path d="M530 64 L513 104" class="arA" marker-end="url(#hA)"/>
<rect x="490" y="108" width="46" height="28" rx="3" class="hot"/>
<text x="513" y="126" class="l" text-anchor="middle">W1</text>
<text x="513" y="154" class="a" text-anchor="middle">wakes</text>
<text x="513" y="170" class="a" text-anchor="middle">exits ✓</text>
<path d="M530 64 L583 104" class="arA" marker-end="url(#hA)"/>
<rect x="560" y="108" width="46" height="28" rx="3" class="hot"/>
<text x="583" y="126" class="l" text-anchor="middle">W2</text>
<text x="583" y="154" class="a" text-anchor="middle">wakes</text>
<text x="583" y="170" class="a" text-anchor="middle">exits ✓</text>
<path d="M530 64 L653 104" class="arA" marker-end="url(#hA)"/>
<rect x="630" y="108" width="46" height="28" rx="3" class="hot"/>
<text x="653" y="126" class="l" text-anchor="middle">W3</text>
<text x="653" y="154" class="a" text-anchor="middle">wakes</text>
<text x="653" y="170" class="a" text-anchor="middle">exits ✓</text>
<path d="M530 64 L723 104" class="arA" marker-end="url(#hA)"/>
<rect x="700" y="108" width="46" height="28" rx="3" class="hot"/>
<text x="723" y="126" class="l" text-anchor="middle">W4</text>
<text x="723" y="154" class="a" text-anchor="middle">wakes</text>
<text x="723" y="170" class="a" text-anchor="middle">exits ✓</text>
<text x="484" y="202" class="f" text-anchor="start">BROADCAST WAKES ALL</text>
<text x="484" y="224" class="a2" text-anchor="start">every worker wakes, drains, exits · join returns ✓</text>
<path d="M440 6 V234" class="ln" stroke-dasharray="2 4"/>
<text x="14" y="254" class="s" text-anchor="start">a worker blocked in pop() cannot see `closed` until something wakes it — so the wake has to reach every one of them.</text>
</svg>
