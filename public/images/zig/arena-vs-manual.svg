<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 248" width="900" height="248" role="img">
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .t   { fill: #131824; font-size: 13px; font-weight: 600; }
  .l   { fill: #131824; font-size: 11.5px; }
  .s   { fill: #4d5670; font-size: 11px; }
  .f   { fill: #808aa4; font-size: 10px; letter-spacing: .08em; }
  .a   { fill: #c8401a; font-size: 11px; font-weight: 600; }
  .a2  { fill: #4b3fd6; font-size: 11px; font-weight: 600; }
  .box { fill: #ffffff; fill-opacity: 0.72; stroke: #a9b3c9; }
  .cell{ fill: #ffffff; fill-opacity: 0.72; stroke: #a9b3c9; }
  .hot { fill: #ffffff; fill-opacity: 0.72; stroke: #c8401a; stroke-width: 1.5; }
  .void{ fill: #dde3ef; fill-opacity: .5; stroke: #a9b3c9; stroke-dasharray: 3 3; }
  .ln  { stroke: #a9b3c9; fill: none; }
  .ar  { stroke: #4d5670; fill: none; stroke-width: 1.4; }
  .arA { stroke: #c8401a; fill: none; stroke-width: 1.6; }
  .hdA { fill: #c8401a; }
  .hd  { fill: #4d5670; }
  .strike { stroke: #c8401a; stroke-width: 1.6; }
</style>
<defs>
  <marker id="h" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
    <path d="M0 0.5 L6 3 L0 5.5 z" class="hd"/>
  </marker>
  <marker id="hA" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
    <path d="M0 0.5 L6 3 L0 5.5 z" class="hdA"/>
  </marker>
</defs>
<text x="14" y="16" class="t" text-anchor="start">(a) testing allocator — every object tracked</text>
<rect x="14" y="32" width="70" height="26" rx="3" class="box"/>
<text x="49" y="49" class="s" text-anchor="middle">gpa</text>
<path d="M49 58 V68" class="ln"/>
<path d="M45 68 H337" class="ln"/>
<path d="M45.0 68 V74" class="ar" marker-end="url(#h)"/>
<rect x="14" y="78" width="62" height="24" rx="3" class="box"/>
<text x="45.0" y="94" class="s" text-anchor="middle">text</text>
<path d="M115.0 68 V74" class="ar" marker-end="url(#h)"/>
<rect x="84" y="78" width="62" height="24" rx="3" class="box"/>
<text x="115.0" y="94" class="s" text-anchor="middle">map</text>
<path d="M188.0 68 V74" class="ar" marker-end="url(#h)"/>
<rect x="154" y="78" width="68" height="24" rx="3" class="box"/>
<text x="188.0" y="94" class="s" text-anchor="middle">key "a"</text>
<path d="M264.0 68 V74" class="ar" marker-end="url(#h)"/>
<rect x="230" y="78" width="68" height="24" rx="3" class="box"/>
<text x="264.0" y="94" class="s" text-anchor="middle">key "b"</text>
<path d="M337.0 68 V74" class="ar" marker-end="url(#h)"/>
<rect x="306" y="78" width="62" height="24" rx="3" class="box"/>
<text x="337.0" y="94" class="s" text-anchor="middle">top[]</text>
<text x="14" y="122" class="f" text-anchor="start">TEARDOWN — ORDER IS LOAD-BEARING</text>
<text x="14" y="142" class="s" text-anchor="start">1. a.free(top)      ← borrower first</text>
<text x="14" y="161" class="s" text-anchor="start">2. free every key   ← then owners</text>
<text x="14" y="180" class="s" text-anchor="start">3. map.deinit()</text>
<text x="14" y="208" class="a" text-anchor="start">get the order wrong → use-after-free ✗</text>
<text x="484" y="16" class="t" text-anchor="start">(b) arena — one lifetime</text>
<rect x="484" y="32" width="70" height="26" rx="3" class="box"/>
<text x="519" y="49" class="s" text-anchor="middle">gpa</text>
<path d="M519 60 V74" class="arA" marker-end="url(#hA)"/>
<text x="566" y="70" class="a" text-anchor="start">big blocks</text>
<rect x="484" y="78" width="390" height="44" rx="3" class="hot"/>
<text x="492" y="94" class="a" text-anchor="start">arena</text>
<rect x="544" y="84" width="60" height="22" rx="3" class="box"/>
<text x="574" y="99" class="s" text-anchor="middle">text</text>
<rect x="610" y="84" width="60" height="22" rx="3" class="box"/>
<text x="640" y="99" class="s" text-anchor="middle">map</text>
<rect x="676" y="84" width="60" height="22" rx="3" class="box"/>
<text x="706" y="99" class="s" text-anchor="middle">"a"</text>
<rect x="742" y="84" width="60" height="22" rx="3" class="box"/>
<text x="772" y="99" class="s" text-anchor="middle">"b"</text>
<rect x="808" y="84" width="60" height="22" rx="3" class="box"/>
<text x="838" y="99" class="s" text-anchor="middle">top[]</text>
<text x="492" y="116" class="f" text-anchor="start">free() is a no-op — nothing is reclaimed one by one</text>
<text x="484" y="148" class="f" text-anchor="start">TEARDOWN</text>
<text x="484" y="170" class="s" text-anchor="start">1. arena.deinit()</text>
<path d="M620 165 H720" class="arA" marker-end="url(#hA)"/>
<text x="726" y="170" class="a" text-anchor="start">all of it, at once</text>
<text x="484" y="208" class="a2" text-anchor="start">no order to get wrong ✓</text>
<path d="M440 6 V220" class="ln" stroke-dasharray="2 4"/>
<text x="450" y="236" class="a2" text-anchor="middle">same countWords / topK — the allocator is a parameter</text>
</svg>
