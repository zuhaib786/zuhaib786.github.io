<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 512" width="700" height="512" role="img">
<rect x="0" y="0" width="700" height="512" fill="#ffffff"/>
<text x="20" y="26" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#8b95ad" text-anchor="start" letter-spacing=".09em">HOW MANY RESPONSES DID THAT WRITE?</text>
<text x="20" y="50" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#4d5670" text-anchor="start">Content-Length from body.len cannot help: both messages are well-formed.</text>
<rect x="20" y="66" width="660" height="30" rx="4" fill="#fbe5da"/>
<text x="34" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" fill="#c2410c" text-anchor="start">each handler decides its own errors</text>
<rect x="20" y="104" width="660" height="34" rx="4" fill="#e6e4fb"/>
<text x="34" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#131824" text-anchor="start">error.Duplicate</text>
<text x="240" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#4d5670" text-anchor="start">respond(409)</text>
<text x="666" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#4338ca" text-anchor="end">return</text>
<rect x="20" y="144" width="660" height="34" rx="4" fill="#fbe5da"/>
<text x="34" y="166" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#131824" text-anchor="start">error.MissingParent</text>
<text x="240" y="166" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#4d5670" text-anchor="start">respond(404)</text>
<text x="666" y="166" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#c2410c" text-anchor="end">falls through</text>
<rect x="20" y="184" width="660" height="34" rx="4" fill="#fbe5da"/>
<text x="34" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#131824" text-anchor="start">else</text>
<text x="240" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#4d5670" text-anchor="start">respond(500)</text>
<text x="666" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#c2410c" text-anchor="end">falls through</text>
<rect x="20" y="228" width="660" height="34" rx="4" fill="#e4e9f3"/>
<text x="34" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#131824" text-anchor="start">respond(201, body)</text>
<text x="666" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#c2410c" text-anchor="end">reached anyway</text>
<rect x="20" y="280" width="320" height="66" rx="4" fill="#fbe5da"/>
<text x="34" y="302" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#c2410c" text-anchor="start">HTTP/1.1 404 Not Found</text>
<text x="34" y="320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#4d5670" text-anchor="start">Content-Length: 21</text>
<text x="34" y="337" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#4d5670" text-anchor="start">{"error":"not found"}</text>
<rect x="360" y="280" width="320" height="66" rx="4" fill="#e4e9f3"/>
<text x="374" y="302" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#131824" text-anchor="start">HTTP/1.1 201 Created</text>
<text x="374" y="320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#4d5670" text-anchor="start">Content-Length: 44</text>
<text x="374" y="337" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#4d5670" text-anchor="start">{"name":"zig-toml", ...}</text>
<text x="350.0" y="370" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle">the second is read as the start of the next response</text>
<rect x="20" y="388" width="660" height="38" rx="5" fill="#e6e4fb"/>
<text x="34" y="412" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#4338ca" text-anchor="start">handlers return errors; one catch in dispatch maps them</text>
<rect x="20" y="448" width="660" height="1" rx="0" fill="#ccd4e4"/>
<text x="20" y="474" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#4d5670" text-anchor="start">The first fix made the length impossible to get wrong. This makes the count impossible to get wrong.</text>
</svg>
