<text x="24" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#e9edf8" text-anchor="start">An allowlist cannot accept prose and reject `'; DROP TABLE`.</text>
<text x="24" y="326" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#a3adc8" text-anchor="start">"Rust's parser", "a &lt; b" -- real descriptions carry exactly the characters an</text>
