<rect x="24" y="238" width="4" height="40" rx="0" fill="#4338ca"/>
<text x="42" y="263" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#131824" text-anchor="start">finalize</text>
<text x="152" y="263" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#4d5670" text-anchor="start">plan released</text>
<rect x="24" y="290" width="652" height="1" rx="0" fill="#ccd4e4"/>
<text x="24" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#131824" text-anchor="start">The statement is compiled before any value exists.</text>
<text x="24" y="336" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#4d5670" text-anchor="start">There is no later moment at which those bytes are read as SQL, so there is no</text>
<text x="24" y="354" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#4d5670" text-anchor="start">escaping to get right. Escaping is a transformation you must remember, apply in</text>
<text x="24" y="372" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#4d5670" text-anchor="start">the correct dialect, and apply exactly once. This removes the step it protects.</text>
