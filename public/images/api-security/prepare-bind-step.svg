<rect x="24" y="178" width="4" height="40" rx="0" fill="#4338ca"/>
<text x="42" y="203" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#131824" text-anchor="start">step</text>
<text x="152" y="203" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#4d5670" text-anchor="start">plan executes</text>
<rect x="554" y="189" width="108" height="18" rx="9" fill="#e6e4fb"/>
<text x="608.0" y="201.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#4338ca" text-anchor="middle">no parse</text>
