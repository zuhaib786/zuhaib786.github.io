<path d="M55 108 L60 116 L65 108 z" fill="#ccd4e4"/>
<rect x="24" y="118" width="652" height="40" rx="4" fill="#eef1f7"/>
<rect x="24" y="118" width="4" height="40" rx="0" fill="#4338ca"/>
<text x="42" y="143" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#131824" text-anchor="start">bind_text</text>
<text x="152" y="143" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#4d5670" text-anchor="start">value dropped into a slot of that plan</text>
<rect x="554" y="129" width="108" height="18" rx="9" fill="#e6e4fb"/>
<text x="608.0" y="141.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#4338ca" text-anchor="middle">no parse</text>
