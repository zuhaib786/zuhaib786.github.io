<text x="152" y="83" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#4d5670" text-anchor="start">SQL text -&gt; compiled query plan</text>
<rect x="554" y="69" width="108" height="18" rx="9" fill="#fbe5da"/>
<text x="608.0" y="81.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#c2410c" text-anchor="middle">the only parse</text>
