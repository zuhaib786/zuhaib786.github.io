<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Expiry is part of accepting a credential</title>
  <desc id="desc">The authentication query requires a digest match, expires_at after now, and last_used_at after the idle cutoff. All passing yields identity; any failure yields no row. Last use is updated only after acceptance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#d6ab7c" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    text { fill: #e6d3bc; font-family: Georgia, 'Times New Roman', serif; }
    .eyebrow { fill: #bea88e; font-family: Arial, sans-serif; font-size: 11px; letter-spacing: 2px; }
    .main { font-size: 20px; }
    .note { fill: #bea88e; font-family: Arial, sans-serif; font-size: 14px; }
    .mono { font-family: 'Courier New', monospace; }
    .label { fill: #d6ab7c; font-size: 13px; }
    .strong { font-size: 16px; }
    .frame { fill: none; stroke: #78624d; stroke-width: 1; }
    .rule { fill: none; stroke: #78624d; stroke-width: 1; }
    .arrow { fill: none; stroke: #d6ab7c; stroke-width: 1.25; marker-end: url(#arrow); }
  </style>
  <text x="28" y="30" class="eyebrow">AUTHENTICATION LOOKUP</text>
  <text x="46" y="76" class="mono label">WHERE</text>
  <rect x="28" y="51" width="384" height="192" rx="3" class="frame"/>
  <text x="46" y="112" class="mono strong">token_hash = candidate_digest</text>
  <text x="46" y="158" class="mono strong">expires_at &gt; now</text>
  <text x="46" y="204" class="mono strong">last_used_at &gt; idle_cutoff</text>
  <path d="M 46 125 H 392 M 46 171 H 392" class="rule"/>
  <path d="M 412 112 H 511" class="arrow"/>
  <text x="462" y="96" class="note" text-anchor="middle">all pass</text>
  <text x="529" y="118" class="main">Identity</text>
  <path d="M 412 204 H 511" class="arrow"/>
  <text x="462" y="188" class="note" text-anchor="middle">any fail</text>
  <text x="529" y="210" class="main">No row</text>
  <path d="M 629 122 H 674 V 282 H 320" class="arrow"/>
  <text x="46" y="289" class="mono strong">last_used_at ← now</text>
  <text x="529" y="258" class="note">after acceptance</text>
  <text x="28" y="325" class="note">idle_cutoff = now − 2 hours · equality with either cutoff rejects</text>
</svg>
