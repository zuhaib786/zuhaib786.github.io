<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Move ownership enforcement out of individual handlers</title>
  <desc id="desc">When checks live inside handlers, each route must remember ownership and a new route can omit it. A shared router permission gate checks the route declaration and object before any handler executes. Correct declarations remain necessary.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#d6ab7c" stroke-width="1.2"/>
    </marker>
    <marker id="fault-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#e29a89" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    text { fill: #e6d3bc; font-family: Georgia, 'Times New Roman', serif; }
    .eyebrow { fill: #bea88e; font-family: Arial, sans-serif; font-size: 11px; letter-spacing: 1.6px; }
    .main { font-size: 20px; }
    .note { fill: #bea88e; font-family: Arial, sans-serif; font-size: 14px; }
    .mono { font-family: 'Courier New', monospace; }
    .strong { font-size: 15px; }
    .frame, .rule { fill: none; stroke: #78624d; stroke-width: 1; }
    .trusted { fill: none; stroke: #d6ab7c; stroke-width: 1.25; }
    .arrow { fill: none; stroke: #d6ab7c; stroke-width: 1.25; marker-end: url(#arrow); }
    .missing { fill: none; stroke: #e29a89; stroke-width: 1; stroke-dasharray: 4 5; }
    .fault-line, .fault-arrow { fill: none; stroke: #e29a89; stroke-width: 1.5; }
    .fault-arrow { marker-end: url(#fault-arrow); }
    .fault-label { fill: #e29a89; font-family: Arial, sans-serif; font-size: 14px; }
    .muted { fill: #bea88e; }
  </style>
  <text x="28" y="30" class="eyebrow">WHERE AN OMISSION CAN HAPPEN</text>
  <path d="M350 60v346" class="rule"/>
  <text x="28" y="77" class="main">Checks inside handlers</text>
  <text x="378" y="77" class="main">One gate before dispatch</text>
  <rect x="65" y="103" width="263" height="46" rx="3" class="frame"/>
  <text x="196" y="132" class="main" text-anchor="middle">Authentication</text>
  <path d="M196 149v22H43v167" class="rule"/>
  <path d="M43 217h15 M43 278h15 M43 339h15" class="rule"/>
  <rect x="65" y="194" width="263" height="46" rx="3" class="frame"/>
  <text x="79" y="223" class="mono strong">publish</text>
  <text x="183" y="223" class="note">checks owner</text>
  <rect x="65" y="255" width="263" height="46" rx="3" class="frame"/>
  <text x="79" y="284" class="mono strong">yank</text>
  <text x="183" y="284" class="note">checks owner</text>
  <rect x="65" y="316" width="263" height="46" rx="3" class="missing"/>
  <text x="79" y="345" class="mono strong">new route</text>
  <text x="183" y="345" class="fault-label">check missing</text>
  <text x="28" y="393" class="note">Omitting a check does not stop dispatch.</text>

  <rect x="385" y="103" width="273" height="67" rx="3" class="trusted"/>
  <text x="521" y="131" class="main" text-anchor="middle">Router permission gate</text>
  <text x="521" y="154" class="note" text-anchor="middle">Route declaration + selected object</text>
  <path d="M521 170v12H367v157" class="rule"/>
  <path d="M367 217h11" class="arrow"/>
  <path d="M367 278h11" class="arrow"/>
  <path d="M367 339h11" class="arrow"/>
  <rect x="385" y="194" width="273" height="46" rx="3" class="frame"/>
  <text x="521" y="223" class="mono strong" text-anchor="middle">publish handler</text>
  <rect x="385" y="255" width="273" height="46" rx="3" class="frame"/>
  <text x="521" y="284" class="mono strong" text-anchor="middle">yank handler</text>
  <rect x="385" y="316" width="273" height="46" rx="3" class="frame"/>
  <text x="521" y="345" class="mono strong" text-anchor="middle">new handler</text>
  <text x="378" y="393" class="note">No handler runs before acceptance.</text>
  <text x="28" y="426" class="note">Shared enforcement does not excuse an incorrect permission declaration.</text>
</svg>
