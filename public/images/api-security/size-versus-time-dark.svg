<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 352" width="700" height="352" role="img">
<rect x="0" y="0" width="700" height="352" fill="#0d1224"/>
<text x="24" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#6b748f" text-anchor="start" letter-spacing="1.2">TWO WAYS TO SPEND A CONNECTION</text>
<rect x="24" y="40" width="652" height="1" rx="0" fill="#313a5c"/>
<text x="24" y="94" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#e9edf8" text-anchor="start">all at once</text>
<text x="24" y="111" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#93a4ff" text-anchor="start">MAX_BODY  -&gt;  413</text>
<rect x="186" y="74" width="474" height="46" rx="4" fill="#161d33"/>
<rect x="194" y="82" width="150" height="30" rx="3" fill="#232b56"/>
<text x="269" y="101" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#93a4ff" text-anchor="middle">100 MB</text>
<rect x="352" y="80" width="3" height="34" rx="0" fill="#93a4ff"/>
<text x="366" y="101" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#a3adc8" text-anchor="start">stopped here</text>
<text x="24" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#e9edf8" text-anchor="start">one byte at a time</text>
<text x="24" y="207" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#ff9470" text-anchor="start">every size check passes</text>
