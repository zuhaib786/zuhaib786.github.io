<text x="652" y="211" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#a3adc8" text-anchor="end">... forever</text>
<text x="186" y="268" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#6b748f" text-anchor="start">time  -&gt;</text>
<rect x="24" y="288" width="652" height="1" rx="0" fill="#313a5c"/>
<text x="24" y="312" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#e9edf8" text-anchor="start">MAX_BODY bounds how much. Nothing in it bounds how long.</text>
<text x="24" y="332" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#a3adc8" text-anchor="start">The second client never trips a size limit, because it never asks for size.</text>
