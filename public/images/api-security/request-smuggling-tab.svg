<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 568" width="700" height="568" role="img">
<rect x="0" y="0" width="700" height="568" fill="#ffffff"/>
<text x="20" y="26" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#8b95ad" text-anchor="start" letter-spacing=".09em">ONE REQUEST, TWO READINGS</text>
<text x="20" y="50" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#4d5670" text-anchor="start">The only unusual byte is a tab before a colon.</text>
<rect x="20" y="66" width="660" height="78" rx="5" fill="#eef1f7"/>
<text x="36" y="90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#131824" text-anchor="start">POST /publish HTTP/1.1</text>
<text x="36" y="111" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#131824" text-anchor="start">Content-Length</text>
<rect x="141.0" y="98" width="18" height="18" rx="3" fill="#c2410c"/>
<text x="150.0" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">\t</text>
<text x="165.0" y="111" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#131824" text-anchor="start">: 5</text>
<text x="36" y="132" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="start">GET /x</text>
<rect x="20" y="160" width="660" height="66" rx="5" fill="#eef1f7"/>
<path d="M20 165 a5 5 0 0 1 5 -5 h3 v66 h-3 a5 5 0 0 1 -5 -5 z" fill="#a16207"/>
<text x="36" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" fill="#131824" text-anchor="start">a normalising proxy</text>
<rect x="550" y="172" width="116" height="18" rx="9" fill="#fbf0d5"/>
<text x="608.0" y="184.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#a16207" text-anchor="middle">trims the tab</text>
<text x="36" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#4d5670" text-anchor="start">name = "Content-Length"   -&gt;   body is 5 bytes</text>
<text x="36" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#4d5670" text-anchor="start">forwards GET /x as that body</text>
<rect x="20" y="236" width="660" height="66" rx="5" fill="#eef1f7"/>
<path d="M20 241 a5 5 0 0 1 5 -5 h3 v66 h-3 a5 5 0 0 1 -5 -5 z" fill="#c2410c"/>
<text x="36" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" fill="#131824" text-anchor="start">this server</text>
<rect x="550" y="248" width="116" height="18" rx="9" fill="#fbe5da"/>
<text x="608.0" y="260.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#c2410c" text-anchor="middle">keeps the tab</text>
<text x="36" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#4d5670" text-anchor="start">name = "Content-Length\t"   -&gt;   no match</text>
<text x="36" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#4d5670" text-anchor="start">concludes the body is 0 bytes</text>
<text x="20" y="334" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#131824" text-anchor="start">what is left in the connection</text>
<rect x="20" y="346" width="246" height="40" rx="4" fill="#e4e9f3"/>
<text x="143.0" y="372" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#8b95ad" text-anchor="middle">request 1 -- consumed</text>
<rect x="270" y="346" width="106" height="40" rx="4" fill="#fbe5da"/>
<text x="323.0" y="372" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#c2410c" text-anchor="middle">GET /x</text>
<rect x="380" y="346" width="296" height="40" rx="4" fill="#fbf0d5"/>
<text x="528.0" y="372" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#a16207" text-anchor="middle">the victim's next request</text>
<rect x="322.0" y="390" width="2" height="13" rx="0" fill="#c2410c"/>
<path d="M318 402 L323 410 L328 402 z" fill="#c2410c"/>
<text x="323" y="428" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#c2410c" text-anchor="middle">parsed as the start of request 2</text>
<rect x="20" y="444" width="660" height="38" rx="5" fill="#e6e4fb"/>
<text x="34" y="468" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#4338ca" text-anchor="start">isToken(name) refuses the field before anyone asks if it is Content-Length</text>
<rect x="20" y="504" width="660" height="1" rx="0" fill="#ccd4e4"/>
<text x="20" y="530" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#4d5670" text-anchor="start">Neither hop is wrong. They are lenient in different directions.</text>
</svg>
