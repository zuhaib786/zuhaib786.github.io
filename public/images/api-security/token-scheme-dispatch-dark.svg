<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-labelledby="title desc">
  <title id="title">One scheme selects one verifier</title>
  <desc id="desc">The Authorization scheme branches to Basic password verification, Bearer digest lookup, or refusal. Verification does not fall back from one scheme to another.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#d6ab7c" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    text { fill: #e6d3bc; font-family: Georgia, 'Times New Roman', serif; }
    .eyebrow { fill: #bea88e; font-family: Arial, sans-serif; font-size: 11px; letter-spacing: 2px; }
    .main { font-size: 20px; }
    .note { fill: #bea88e; font-family: Arial, sans-serif; font-size: 14px; }
    .mono { font-family: 'Courier New', monospace; }
    .label { fill: #d6ab7c; font-size: 13px; }
    .strong { font-size: 16px; }
    .frame { fill: none; stroke: #78624d; stroke-width: 1; }
    .rule { fill: none; stroke: #78624d; stroke-width: 1; }
    .arrow { fill: none; stroke: #d6ab7c; stroke-width: 1.25; marker-end: url(#arrow); }
  </style>
  <text x="28" y="30" class="eyebrow">ONE HEADER · ONE PARSER</text>
  <text x="28" y="150" class="main">Authorization</text>
  <text x="28" y="177" class="note">Read the scheme once</text>
  <path d="M 198 153 H 240 M 240 80 V 228" class="rule"/>
  <path d="M 240 80 H 293" class="arrow"/>
  <path d="M 240 153 H 293" class="arrow"/>
  <path d="M 240 228 H 293" class="arrow"/>
  <text x="310" y="85" class="mono strong">Basic</text>
  <text x="310" y="158" class="mono strong">Bearer</text>
  <text x="310" y="233" class="mono strong">other</text>
  <path d="M 398 80 H 456" class="arrow"/>
  <path d="M 398 153 H 456" class="arrow"/>
  <path d="M 398 228 H 456" class="arrow"/>
  <text x="475" y="78" class="main">Verify password</text>
  <text x="475" y="102" class="note">Argon2id</text>
  <text x="475" y="151" class="main">Look up digest</text>
  <text x="475" y="175" class="note">SHA-256 + expiry checks</text>
  <text x="475" y="233" class="main">Refuse</text>
  <text x="28" y="278" class="note">A failed verifier returns invalid; it never tries the other scheme.</text>
</svg>
