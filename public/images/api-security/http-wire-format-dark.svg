<text x="113" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#6b748f" text-anchor="middle">SP</text>
<rect x="128" y="146" width="168" height="34" rx="4" fill="#232b56"/>
<text x="212.0" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#93a4ff" text-anchor="middle">/packages/x</text>
<text x="212.0" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#e9edf8" text-anchor="middle">target</text>
<text x="212.0" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#6b748f" text-anchor="middle">must start with /</text>
<text x="311" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#6b748f" text-anchor="middle">SP</text>
