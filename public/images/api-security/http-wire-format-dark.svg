<text x="330.0" y="275" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#e8bc4e" text-anchor="middle">SP</text>
<text x="330.0" y="302" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#6b748f" text-anchor="middle">OWS, trimmed</text>
<rect x="382" y="252" width="86" height="34" rx="4" fill="#1d2542"/>
<text x="425.0" y="275" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#e9edf8" text-anchor="middle">27</text>
<text x="425.0" y="302" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#6b748f" text-anchor="middle">the value</text>
<rect x="20" y="320" width="660" height="34" rx="4" fill="#3b2118"/>
<text x="34" y="342" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#ff9470" text-anchor="start">no whitespace between the name and the colon -- RFC 9112 5.1 MUST reject</text>
<rect x="20" y="376" width="660" height="1" rx="0" fill="#313a5c"/>
<text x="20" y="402" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#a3adc8" text-anchor="start">Every boundary above is a decision the spec answers.</text>
