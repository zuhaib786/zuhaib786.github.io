<text x="34" y="428" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#6b748f" text-anchor="start">attacker chooses</text>
<rect x="152.0" y="421" width="9" height="9" rx="2" fill="#93a4ff"/>
<text x="166.0" y="428" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#6b748f" text-anchor="start">parser fixes the meaning</text>
