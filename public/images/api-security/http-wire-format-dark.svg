<text x="20" y="50" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#a3adc8" text-anchor="start">The parser consumes the stream in wire order. Each region has its own grammar.</text>
