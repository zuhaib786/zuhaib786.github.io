<text x="103.0" y="275" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#93a4ff" text-anchor="middle">Content-Length</text>
<text x="103.0" y="302" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#6b748f" text-anchor="middle">tchar only</text>
