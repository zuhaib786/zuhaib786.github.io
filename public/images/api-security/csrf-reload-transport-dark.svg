<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-labelledby="title desc">
  <title id="title">The cookie survives the reload; the session owns the verifier</title>
  <desc id="desc">The browser retains two cookies across reloads. The HttpOnly session cookie selects a session record. Application code reads the separate CSRF cookie and submits its token in a custom header. The server compares its digest with that record, not with the incoming CSRF cookie.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#d6ab7c" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    text { fill: #e6d3bc; font-family: Georgia, 'Times New Roman', serif; }
    .eyebrow { fill: #bea88e; font-family: Arial, sans-serif; font-size: 11px; letter-spacing: 1.6px; }
    .main { font-size: 20px; }
    .note { fill: #bea88e; font-family: Arial, sans-serif; font-size: 14px; }
    .mono { font-family: 'Courier New', monospace; }
    .strong { font-size: 15px; }
    .label { fill: #d6ab7c; font-family: Arial, sans-serif; font-size: 13px; }
    .frame, .rule { fill: none; stroke: #78624d; stroke-width: 1; }
    .trusted { fill: none; stroke: #d6ab7c; stroke-width: 1.25; }
    .arrow { fill: none; stroke: #d6ab7c; stroke-width: 1.25; marker-end: url(#arrow); }
  </style>
  <text x="28" y="30" class="eyebrow">RELOAD: RETAIN TRANSPORT, KEEP AUTHORITY SERVER-SIDE</text>
  <text x="28" y="79" class="main">Browser after reload</text>
  <text x="451" y="79" class="main">Authenticated session</text>

  <rect x="28" y="101" width="232" height="66" rx="3" class="frame"/>
  <text x="44" y="129" class="main">Session cookie</text>
  <text x="44" y="152" class="note">HttpOnly · browser attaches it</text>
  <path d="M 260 135 H 433" class="arrow"/>
  <text x="346" y="119" class="label" text-anchor="middle">authenticate</text>
  <rect x="451" y="101" width="221" height="159" rx="3" class="trusted"/>
  <text x="469" y="133" class="mono strong">session record</text>
  <path d="M 469 153 H 654" class="rule"/>
  <text x="469" y="186" class="main">Expected CSRF digest</text>
  <text x="469" y="212" class="note">Issued for this session</text>
  <text x="469" y="239" class="note">Not recoverable as a token</text>

  <rect x="28" y="221" width="232" height="66" rx="3" class="frame"/>
  <text x="44" y="249" class="main">CSRF transport cookie</text>
  <text x="44" y="272" class="note">JavaScript can read the token</text>
  <path d="M 144 287 V 309" class="arrow"/>
  <rect x="28" y="321" width="232" height="44" rx="3" class="frame"/>
  <text x="144" y="349" class="mono strong" text-anchor="middle">custom request header</text>
  <path d="M 260 343 H 433" class="arrow"/>
  <text x="346" y="328" class="label" text-anchor="middle">digest(header)</text>
  <path d="M 561 260 V 309" class="arrow"/>
  <rect x="451" y="321" width="221" height="44" rx="3" class="trusted"/>
  <text x="561" y="349" class="main" text-anchor="middle">Verify against the row</text>
  <text x="28" y="391" class="note">No server-side comparison uses the CSRF cookie carried in the request.</text>
</svg>
