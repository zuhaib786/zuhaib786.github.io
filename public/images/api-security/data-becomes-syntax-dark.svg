<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 404" width="700" height="404" role="img">
<rect x="0" y="0" width="700" height="404" fill="#0d1224"/>
<text x="24" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#6b748f" text-anchor="start" letter-spacing="1.2">ONE PAYLOAD, TWO GRAMMARS</text>
<rect x="24" y="40" width="652" height="1" rx="0" fill="#313a5c"/>
<rect x="24" y="56" width="652" height="30" rx="4" fill="#1d2542"/>
<text x="38" y="76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#e9edf8" text-anchor="start">x', 'ts'); DROP TABLE versions;--</text>
<text x="24" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#ff9470" text-anchor="start">built by interpolation</text>
<rect x="24" y="128" width="652" height="32" rx="3" fill="#161d33"/>
<rect x="24" y="128" width="4" height="32" rx="0" fill="#ff9470"/>
<text x="40" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#a3adc8" text-anchor="start">SQL</text>
<text x="84" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#e9edf8" text-anchor="start">VALUES ('x', 'ts'); DROP TABLE versions;--')</text>
<text x="662" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#ff9470" text-anchor="end">two statements</text>
<rect x="24" y="166" width="652" height="32" rx="3" fill="#161d33"/>
<rect x="24" y="166" width="4" height="32" rx="0" fill="#ff9470"/>
<text x="40" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#a3adc8" text-anchor="start">JSON</text>
<text x="84" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#e9edf8" text-anchor="start">{"description":"d","admin":"true"}</text>
<text x="662" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#ff9470" text-anchor="end">forged key</text>
<text x="24" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#93a4ff" text-anchor="start">built by the grammar's own writer</text>
<rect x="24" y="240" width="652" height="32" rx="3" fill="#161d33"/>
<rect x="24" y="240" width="4" height="32" rx="0" fill="#93a4ff"/>
<text x="40" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#a3adc8" text-anchor="start">SQL</text>
<text x="84" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#e9edf8" text-anchor="start">VALUES (?)   &lt;- value bound out of band</text>
<text x="662" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#93a4ff" text-anchor="end">one statement</text>
<rect x="24" y="278" width="652" height="32" rx="3" fill="#161d33"/>
<rect x="24" y="278" width="4" height="32" rx="0" fill="#93a4ff"/>
<text x="40" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#a3adc8" text-anchor="start">JSON</text>
<text x="84" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#e9edf8" text-anchor="start">{"description":"d\"..."}   &lt;- escaped</text>
<text x="662" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#93a4ff" text-anchor="end">one field</text>
<rect x="24" y="330" width="652" height="1" rx="0" fill="#313a5c"/>
<text x="24" y="354" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#e9edf8" text-anchor="start">The defect is not SQL, and not JSON. It is a value permitted to become syntax.</text>
<text x="24" y="374" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#a3adc8" text-anchor="start">The fix is the same both times: the value never reaches the parser as text.</text>
</svg>
