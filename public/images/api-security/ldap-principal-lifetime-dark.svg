<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" role="img" aria-labelledby="title desc">
  <title id="title">Keep request principals independent of decoder buffers</title>
  <desc id="desc">The decoder returns a frame backed by a byte buffer containing username and password; when the frame ends, that storage is no longer valid. A principal slice that points into it may expose use after return. Instead copy the username into request-owned storage and release the temporary decoded credentials early. A deterministic test overwrites the same decode buffer after principal resolution and checks that the principal remains correct.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#d6ab7c" stroke-width="1.2"/></marker></defs>
  <style>text{fill:#e6d3bc;font-family:Georgia,'Times New Roman',serif}.eyebrow{fill:#bea88e;font:11px Arial,sans-serif;letter-spacing:1.6px}.main{font-size:18px}.note{fill:#bea88e;font:13px Arial,sans-serif}.mono{font:13px 'Courier New',monospace}.label{font:12px Arial,sans-serif}.frame,.rule{fill:none;stroke:#78624d;stroke-width:1}.good{fill:none;stroke:#d6ab7c;stroke-width:1.4}.bad{fill:none;stroke:#e29a89;stroke-width:1.4}.goodtxt{fill:#d6ab7c;font:12px Arial,sans-serif}.badtxt{fill:#e29a89;font:12px Arial,sans-serif}.flow{marker-end:url(#arrow)}</style>
  <text x="28" y="30" class="eyebrow">CREDENTIAL MEMORY LIFETIME</text><text x="28" y="65" class="main">The principal must outlive the decoder frame</text><path d="M350 84v246" class="rule"/>
  <text x="28" y="105" class="label">BORROWED SLICE · DANGLING</text><text x="378" y="105" class="label">OWNED PRINCIPAL · SAFE</text>
  <rect x="28" y="120" width="284" height="132" rx="3" class="bad" stroke-dasharray="5 4"/><text x="170" y="144" text-anchor="middle" class="label">decoder frame · returned</text><rect x="73" y="171" width="194" height="48" rx="3" class="bad"/><text x="170" y="200" text-anchor="middle" class="mono">username:password</text>
  <rect x="73" y="270" width="194" height="42" rx="3" class="frame"/><text x="170" y="296" text-anchor="middle" class="label">request principal slice</text><path d="M170 270v-47" class="bad" marker-end="url(#arrow)"/><text x="170" y="246" text-anchor="middle" class="badtxt">borrowed storage</text>
  <rect x="378" y="120" width="294" height="65" rx="3" class="bad" stroke-dasharray="5 4"/><text x="525" y="144" text-anchor="middle" class="label">temporary decoded frame</text><text x="525" y="168" text-anchor="middle" class="mono">username:password</text>
  <rect x="423" y="220" width="204" height="46" rx="3" class="good"/><text x="525" y="248" text-anchor="middle" class="mono">request-owned username</text><path d="M525 185v35" class="good" marker-end="url(#arrow)"/><text x="638" y="207" text-anchor="end" class="goodtxt">copy username</text>
  <path d="M430 281h190" class="bad" stroke-dasharray="4 4"/><text x="525" y="302" text-anchor="middle" class="note">frame ends · password released</text><text x="525" y="320" text-anchor="middle" class="label">no password retained</text>
  <path d="M28 337h644" class="rule"/><text x="28" y="363" class="label">DETERMINISTIC LIFETIME TEST</text>
  <rect x="28" y="377" width="129" height="53" rx="3" class="frame"/><text x="92" y="399" text-anchor="middle" class="label">own decode</text><text x="92" y="417" text-anchor="middle" class="label">buffer</text><path d="M157 403h20 M319 403h20 M481 403h20" class="good" marker-end="url(#arrow)"/>
  <rect x="177" y="377" width="142" height="53" rx="3" class="frame"/><text x="248" y="399" text-anchor="middle" class="label">resolve</text><text x="248" y="417" text-anchor="middle" class="label">principal</text>
  <rect x="339" y="377" width="142" height="53" rx="3" class="frame"/><text x="410" y="399" text-anchor="middle" class="label">overwrite SAME</text><text x="410" y="417" text-anchor="middle" class="label">buffer</text>
  <rect x="501" y="377" width="171" height="53" rx="3" class="good"/><text x="586" y="399" text-anchor="middle" class="goodtxt">principal still</text><text x="586" y="417" text-anchor="middle" class="goodtxt">correct</text><text x="28" y="450" class="note">Reusing the original storage exposes accidental aliasing.</text>
</svg>
